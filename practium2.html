<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSphere - Farm to Table Grocery Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f8f3;
            color: #2e4a23;
        }
        header {
            text-align: center;
            padding: 15px;
            background-color: #2e7d32;
            color: white;
            border-radius: 8px;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        .audio-section {
            text-align: center;
            margin: 20px 0;
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
        }
        .banner {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .media-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        iframe, video {
            width: 100%;
            border-radius: 6px;
            border: none;
        }
        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- 1 & 2. Standard Setup, Header, and Navigation -->
    <header>
        <h1>FoodSphere</h1>
        <p>Fresh Farm-to-Table Grocery Delivery</p>
        <nav>
            <a href="#home">Home</a> |
            <a href="#catalog">Fresh Catalog</a> |
            <a href="#story">Farm Tour</a> |
            <a href="#location">Delivery Area</a>
        </nav>
    </header>

    <!-- 3. Native Audio Element with Controls -->
    <div class="audio-section">
        <h3>Listen to the FoodSphere Audio Welcome Guide</h3>
        <audio controls autoplay loop>
            <source src="alexzavesa-calm-inspiring-technology-logo-short-version-518993.mp3">
            <source src="alexzavesa-calm-inspiring-technology-logo-short-version-518993.mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

    <!-- 4. Main Banner Image -->
    <img class="banner" src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80" alt="FoodSphere Fresh Produce Banner">

    <!-- Grid Layout for PDF Catalog & Embedded Video -->
    <div class="content-grid">
        <!-- 5. Embedded PDF Catalog via iframe -->
        <div class="media-box" id="catalog">
            <h3>Weekly Farm Fresh Catalog (PDF)</h3>
            <iframe src="Food_Sphere_Project.pdf" height="320">
                Your browser does not support PDF iframe embedding.
            </iframe>
        </div>

        <!-- 6. Embedded HTML5 Video & YouTube Video -->
        <div class="media-box" id="story">
            <h3>Our Farm Harvest Video</h3>
            <!-- HTML5 Video Tag with controls and poster placeholder -->
            <video controls poster="https://images.unsplash.com/photo-1500937386664-56d1dfef3854?auto=format&fit=crop&w=600&q=80" height="200">
                <source src="video.mp4" type="video/mp4">
                <source src="video.mp4" type="video/webm">
                Your browser does not support the video tag.
            </video>

            <!-- <h4>Watch YouTube Farm Journey</h4>
            <!-- Embedded YouTube Video
            <iframe height="180" src="https://www.youtube.com/embed/6dFnpz_AEyA" title="FoodSphere Farm Tour" allowfullscreen></iframe>
        </div> -->
    </div>

     <!-- 7. Embedded Google Maps 
    <div class="media-box" id="location">
        <h3>FoodSphere Hub & Local Farm Location</h3>
        <iframe src="" height="300" loading="lazy"></iframe>
    </div>  -->



























    

</body>
</html>
